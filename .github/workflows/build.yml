name: Java CI with Maven

on:
  workflow_dispatch:
  push:
    branches: [ main, 2.3.x, 2.4.x, 3.0.x, 3.1.x, 3.2.x, 3.3.x, 3.4.x, 4.0.x]
  pull_request:
    branches: [ main, 2.3.x, 2.4.x, 3.0.x, 3.1.x, 3.2.x, 3.3.x, 3.4.x, 4.0.x ]

permissions:
  contents: read

jobs:
  build:
    name: Test with JDK ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: [ 17, 21, 24 ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Pull the test images in the background
        run: |
          for image in localstack/localstack:4.14.0 floci/floci:1.5.33 testcontainers/ryuk:0.14.0; do
            docker pull "$image" > /dev/null 2>&1 &
          done
      - name: Set up JDK ${{ matrix.version }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.version }}
          cache: maven
      - name: Build with Maven
        run: ./mvnw -V -B -T 3 verify -Pspring
  docs:
    name: Validate Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Validate AsciiDoc
        run: ./mvnw -V -B verify -Pdocs-classic -DskipTests
  sonar:
    name: Run Sonar Analysis
    runs-on: ubuntu-latest
    # Disable Sonar for foreign PRs
    if: false
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Cache SonarCloud packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Build with Maven
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -V -B -T 1C verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Pcoverage,spring
